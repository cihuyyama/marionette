[package]
name = "marionette"
version = "0.1.0"
edition = "2021"
description = "Thin Rust OpenAI-compatible proxy pool (grok-cli + qoder)"
license = "MIT"
default-run = "marionette"

[lib]
name = "marionette"
path = "src/lib.rs"

[[bin]]
name = "marionette"
path = "src/main.rs"

[[bin]]
name = "marionette-import"
path = "src/bin/import.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
# http2 required for Qoder SSE (HTTP/1.1-only → chunked UnexpectedEof). No compress codecs.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
md-5 = "0.10"
rand = "0.8"
bytes = "1"
http-body-util = "0.1"
mime_guess = "2"
tokio-stream = "0.1"
rsa = { version = "0.9", features = ["pem", "sha2"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
block-padding = "0.4"
pkcs1 = { version = "0.7", features = ["std"] }
pkcs8 = { version = "0.10", features = ["std", "pem"] }

[profile.release]
lto = true
codegen-units = 1
