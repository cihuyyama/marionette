name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep debug info out of the build: CI only needs to compile and run tests.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  backend:
    name: Rust — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # sqlx + reqwest + the crypto crates dominate build time; caching the
      # registry and target/ turns a ~4 min cold build into well under a minute.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets
        env:
          RUST_LOG: warn

  frontend:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` already runs `tsc --noEmit` before `vite build`, so a
      # type error fails here rather than shipping a broken bundle.
      - name: Build
        run: npm run build
